<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>404 — Isabella Gilarranz</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAAACXBIWXMAAAsTAAALEwEAmpwYAAAAd0lEQVR4nO2VSw7AIAhE5+oeYU7crrpp+qHqYCG8hI2J8gKiQFF8hK1tT4G0AjQmkElxtcBBT/klleAqAWsC61pegStyCLBjzORTAKUABx4VScnhJcAJ9jIBevYefxSw3o+YAhywPu+NKWD599/i7gyEEigKOLEDsZjEcIsO2EMAAAAASUVORK5CYII=" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Karla:wght@400;500&family=Pixelify+Sans&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #FFFDF9; --ink: #3B3335; --soft: #7E7376; --bunny: #918181;
    --rose: #C4808F; --rose-deep: #A96473; --blush: #F7ECEC; --line: #EAE2DC;
    --s1: #CBD3BC; --s2: #F3DCE4; --stitch: #D97A94;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: 'Karla', sans-serif; font-size: 16.5px; line-height: 1.75;
    min-height: 100vh; display: flex; flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }
  .awning { line-height: 0; }
  .awning::before { content: ""; display: block; height: 14px;
    background: repeating-linear-gradient(90deg, var(--s1) 0 18px, var(--s2) 18px 28px); }
  .awning::after { content: ""; display: block; height: 4px; margin-top: 4px;
    background: repeating-linear-gradient(90deg, var(--stitch) 0 7px, transparent 7px 14px); }
  main {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; padding: 3rem 1.4rem; position: relative; overflow: hidden;
  }
  main::before {
    content: ""; position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: min(680px, 110vw); height: 440px; pointer-events: none;
    background:
      radial-gradient(closest-side at 38% 42%, rgba(246,170,190,0.48), transparent 72%),
      radial-gradient(closest-side at 66% 34%, rgba(250,205,160,0.40), transparent 70%),
      radial-gradient(closest-side at 52% 72%, rgba(214,190,230,0.38), transparent 72%);
    filter: blur(34px);
  }
  main > * { position: relative; }
  .hop-wrap {
    display: inline-block;
    margin-bottom: 1.4rem;
    animation: wander 9s ease-in-out infinite;
    animation-delay: 1.2s;
  }
  img.bunny {
    width: 84px; height: 84px; image-rendering: pixelated;
    display: block;
    animation: bounce 0.45s ease-in-out infinite;
  }
  /* travel: hop away right, vanish, reappear, hop home, turn around, rest */
  @keyframes wander {
    0%   { transform: translateX(0) scaleX(1); opacity: 1; }
    8%   { transform: translateX(0) scaleX(1); opacity: 1; }
    38%  { transform: translateX(56vw) scaleX(1); opacity: 1; }
    42%  { transform: translateX(60vw) scaleX(1); opacity: 0; }
    48%  { transform: translateX(60vw) scaleX(-1); opacity: 0; }
    52%  { transform: translateX(56vw) scaleX(-1); opacity: 1; }
    82%  { transform: translateX(0) scaleX(-1); opacity: 1; }
    88%  { transform: translateX(0) scaleX(-1); opacity: 1; }
    89%  { transform: translateX(0) scaleX(1); opacity: 1; }
    100% { transform: translateX(0) scaleX(1); opacity: 1; }
  }
  /* little hops while traveling and while home */
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .hop-wrap, img.bunny { animation: none; }
  }
  .px { font-family: 'Pixelify Sans', monospace; font-size: 0.85rem;
    letter-spacing: 0.12em; color: var(--bunny); display: block; margin-bottom: 0.6rem; }
  h1 { font-family: 'Fraunces', serif; font-weight: 500;
    font-size: clamp(2.6rem, 8vw, 3.8rem); line-height: 1.05; margin-bottom: 1rem; }
  p { color: var(--soft); max-width: 380px; margin: 0 auto 2rem; }
  a.home {
    color: var(--rose-deep); text-decoration: none;
    border-bottom: 1.5px solid var(--blush); transition: border-color 0.2s ease;
  }
  a.home:hover { border-color: var(--rose); }
  a.home:focus-visible { outline: 2px solid var(--rose); outline-offset: 3px; }
  footer { text-align: center; padding: 1.6rem 0 2.2rem;
    font-family: 'Pixelify Sans', monospace; font-size: 0.75rem; color: var(--bunny); }
</style>
</head>
<body>
<div class="awning" aria-hidden="true"></div>
<main>
  <span class="hop-wrap"><img class="bunny" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAAACXBIWXMAAAsTAAALEwEAmpwYAAAAd0lEQVR4nO2VSw7AIAhE5+oeYU7crrpp+qHqYCG8hI2J8gKiQFF8hK1tT4G0AjQmkElxtcBBT/klleAqAWsC61pegStyCLBjzORTAKUABx4VScnhJcAJ9jIBevYefxSw3o+YAhywPu+NKWD599/i7gyEEigKOLEDsZjEcIsO2EMAAAAASUVORK5CYII=" alt="A pixel bunny hopping off to search for the page" /></span>
  <span class="px">error 404</span>
  <h1>this page hopped away</h1>
  <p>The bunny went looking for it, but no luck. It's probably back at the burrow.</p>
  <a class="home" href="/">← back home</a>
</main>
<footer>made in venezuela · isabella gilarranz</footer>
</body>
</html>
