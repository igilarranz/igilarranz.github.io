<style>
  :root { --bg:#FFFDF9; --ink:#3B3335; --soft:#7E7376; --bunny:#918181; --rose:#C4808F; --rose-deep:#A96473; --blush:#F7ECEC; --line:#EAE2DC; --s1:#CBD3BC; --s2:#F3DCE4; --stitch:#D97A94; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--ink); font-family:'Karla',sans-serif; font-size:16.5px; line-height:1.75; min-height:100vh; display:flex; flex-direction:column; -webkit-font-smoothing:antialiased; }

  .awning::after { content:""; display:block; height:4px; margin-top:4px; background:repeating-linear-gradient(90deg,var(--stitch) 0 7px,transparent 7px 14px); }
  main { flex:1; display:grid; place-items:center; text-align:center; padding:3rem 1.4rem; }

  img { width:84px; height:84px; image-rendering:pixelated; margin-bottom:1rem; animation:sniff 1.6s ease-in-out infinite; }
  @keyframes sniff { 0%,100% { transform:translateX(-18px) scaleX(1); } 50% { transform:translateX(18px) scaleX(-1); } }
  @media (prefers-reduced-motion:reduce) { img { animation:none; } }
  h1 { font-family:'Fraunces',serif; font-weight:500; font-size:clamp(2.2rem,7vw,3.2rem); line-height:1.08; letter-spacing:-0.015em; margin-bottom:0.8rem; }
  p { color:var(--soft); max-width:420px; margin:0 auto 1.8rem; }
  a { color:var(--rose-deep); text-decoration:none; border-bottom:1.5px solid var(--blush); }
  a:hover { border-color:var(--rose); }
